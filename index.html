<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer Reveal Game</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 650px;
      margin: 0 auto;
      padding: 24px 18px;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 14px;
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 130px;
      padding: 12px;
      font-size: 16px;
    }

    select, button {
      font-size: 16px;
      padding: 12px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
    }

    #timer {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .answer {
      white-space: pre-wrap;
      padding: 14px;
      background: #eee;
      border-radius: 8px;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Answer Reveal Game</h1>

  <div id="setup" class="card">
    <h2>新しい部屋を作る</h2>

    <label>
      公開方法
      <select id="mode">
        <option value="1">1分後</option>
        <option value="3">3分後</option>
        <option value="5">5分後</option>
        <option value="10">10分後</option>
        <option value="15">15分後</option>
        <option value="30">30分後</option>
        <option value="wait">2人の回答が揃ってから1分後</option>
      </select>
    </label>

    <br>
    <button id="createRoom">部屋を作る</button>
  </div>

  <div id="game" class="card hidden">

    <div id="timer"></div>

    <p id="shareArea">
      相手にこのURLを送ってください。
      <br>
      <button id="copyUrl">URLをコピー</button>
    </p>

    <h2>あなたの回答</h2>

    <textarea
      id="answer"
      placeholder="ここに回答を書いてください"
    ></textarea>

    <br>

    <button id="submitAnswer">
      回答を送信
    </button>

    <div id="status"></div>

    <div id="results" class="hidden">
      <h2>回答</h2>

      <h3>Player A</h3>
      <div id="answerA" class="answer"></div>

      <h3>Player B</h3>
      <div id="answerB" class="answer"></div>
    </div>

  </div>

<script>
const SUPABASE_URL =
  "https://daztoxcjevdacvwhtboa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ED8zvFDCLnEFlf2ZRS5Yeg_V76Q3IdP";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params = new URLSearchParams(location.search);

let roomId = params.get("room");
let revealAt = params.get("reveal");
let player = params.get("player");
let mode = params.get("mode");

const setup = document.getElementById("setup");
const game = document.getElementById("game");
const timer = document.getElementById("timer");

function randomRoom() {
  return crypto.randomUUID();
}

document.getElementById("createRoom").onclick =
async () => {

  const choice =
    document.getElementById("mode").value;

  roomId = randomRoom();
  player = "A";

  if (choice === "wait") {
    mode = "wait";
    revealAt = null;
  } else {
    mode = "timer";
    const minutes = Number(choice);

    revealAt = new Date(
      Date.now() + minutes * 60 * 1000
    ).toISOString();
  }

  const { error } = await db
    .from("rooms")
    .insert({
      room_id: roomId,
      mode: mode,
      reveal_at: revealAt
    });

  if (error) {
    alert("部屋の作成に失敗しました");
    console.error(error);
    return;
  }

  const url = new URL(location.href);

  url.searchParams.set("room", roomId);
  url.searchParams.set("player", "A");
  url.searchParams.set("mode", mode);

  if (revealAt) {
    url.searchParams.set("reveal", revealAt);
  } else {
    url.searchParams.delete("reveal");
  }

  location.href = url.toString();
};

if (roomId && mode) {

  setup.classList.add("hidden");
  game.classList.remove("hidden");

  if (!player) player = "B";

  if (mode === "wait") {
    timer.textContent = "回答待ち";
    watchRoom();
  } else {
    startTimer();
  }
}

document.getElementById("copyUrl").onclick =
async () => {

  const url = new URL(location.href);

  url.searchParams.set("player", "B");

  await navigator.clipboard.writeText(
    url.toString()
  );

  alert("相手用URLをコピーしました");
};

document.getElementById("submitAnswer").onclick =
async () => {

  const answer =
    document.getElementById("answer").value.trim();

  if (!answer) {
    alert("回答を入力してください");
    return;
  }

  document.getElementById("submitAnswer").disabled = true;

  let error;

  if (mode === "wait") {

    const result = await db.rpc(
      "submit_wait_answer",
      {
        p_room_id: roomId,
        p_player: player,
        p_answer: answer
      }
    );

    error = result.error;

  } else {

    const result = await db
      .from("answers")
      .insert({
        room_id: roomId,
        player: player,
        answer: answer,
        reveal_at: revealAt
      });

    error = result.error;
  }

  if (error) {
    console.error(error);

    document.getElementById("status").textContent =
      "送信に失敗しました";

    document.getElementById("submitAnswer").disabled = false;
    return;
  }

  document.getElementById("answer").disabled = true;

  if (mode === "wait") {
    document.getElementById("status").textContent =
      "回答を送信しました。相手の回答を待っています。";
  } else {
    document.getElementById("status").textContent =
      "回答を送信しました。公開時間までお待ちください。";
  }
};

function startTimer() {

  const interval = setInterval(async () => {

    const remaining =
      new Date(revealAt).getTime() - Date.now();

    if (remaining <= 0) {

      clearInterval(interval);

      timer.textContent = "公開！";

      await loadAnswers();

      return;
    }

    const min =
      Math.floor(remaining / 60000);

    const sec =
      Math.floor((remaining % 60000) / 1000);

    timer.textContent =
      `${min}:${String(sec).padStart(2, "0")}`;

  }, 250);
}

async function watchRoom() {

  const interval = setInterval(async () => {

    const { data, error } = await db
      .from("rooms")
      .select("reveal_at")
      .eq("room_id", roomId)
      .single();

    if (error) {
      console.error(error);
      return;
    }

    if (data && data.reveal_at) {

      clearInterval(interval);

      revealAt = data.reveal_at;

      document.getElementById("status").textContent =
        "2人の回答が揃いました。1分後に公開します。";

      startTimer();
    }

  }, 1000);
}

async function loadAnswers() {

  const { data, error } = await db
    .from("answers")
    .select("player, answer")
    .eq("room_id", roomId);

  if (error) {
    console.error(error);
    return;
  }

  const a = data.find(
    x => x.player === "A"
  );

  const b = data.find(
    x => x.player === "B"
  );

  document.getElementById("answerA").textContent =
    a ? a.answer : "未回答";

  document.getElementById("answerB").textContent =
    b ? b.answer : "未回答";

  document.getElementById("results")
    .classList.remove("hidden");
}

</script>

</body>
</html>
