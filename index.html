<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer Reveal Game</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 650px;
      margin: 0 auto;
      padding: 24px 18px;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 14px;
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 130px;
      padding: 12px;
      font-size: 16px;
    }

    select, button {
      font-size: 16px;
      padding: 12px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
    }

    #timer {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .answer {
      white-space: pre-wrap;
      padding: 14px;
      background: #eee;
      border-radius: 8px;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Answer Reveal Game</h1>

  <div id="setup" class="card">
    <h2>新しい部屋を作る</h2>

    <label>
      公開までの時間
      <select id="minutes">
        <option value="1">1分</option>
        <option value="3">3分</option>
        <option value="5">5分</option>
        <option value="10">10分</option>
        <option value="15">15分</option>
        <option value="30">30分</option>
      </select>
    </label>

    <br>
    <button id="createRoom">部屋を作る</button>
  </div>

  <div id="game" class="card hidden">

    <div id="timer"></div>

    <p id="shareArea">
      相手にこのURLを送ってください。
      <br>
      <button id="copyUrl">URLをコピー</button>
    </p>

    <h2>あなたの回答</h2>

    <textarea
      id="answer"
      placeholder="ここに回答を書いてください"
    ></textarea>

    <br>

    <button id="submitAnswer">
      回答を送信
    </button>

    <div id="status"></div>

    <div id="results" class="hidden">
      <h2>回答</h2>

      <h3>Player A</h3>
      <div id="answerA" class="answer"></div>

      <h3>Player B</h3>
      <div id="answerB" class="answer"></div>
    </div>

  </div>

<script>
const SUPABASE_URL = "https://daztoxcjevdacvwhtboa.supabase.co";
const SUPABASE_KEY = "sb_publishable_ED8zvFDCLnEFlf2ZRS5Yeg_V76Q3IdP";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params = new URLSearchParams(location.search);

let roomId = params.get("room");
let revealAt = params.get("reveal");
let player = params.get("player");

const setup = document.getElementById("setup");
const game = document.getElementById("game");

function randomRoom() {
  return crypto.randomUUID();
}

document.getElementById("createRoom").onclick = () => {
  const minutes =
    Number(document.getElementById("minutes").value);

  roomId = randomRoom();

  revealAt = new Date(
    Date.now() + minutes * 60 * 1000
  ).toISOString();

  player = "A";

  const url = new URL(location.href);

  url.searchParams.set("room", roomId);
  url.searchParams.set("reveal", revealAt);
  url.searchParams.set("player", "A");

  location.href = url.toString();
};

if (roomId && revealAt) {
  setup.classList.add("hidden");
  game.classList.remove("hidden");

  if (!player) player = "B";

  startTimer();
}

document.getElementById("copyUrl").onclick = async () => {
  const url = new URL(location.href);

  url.searchParams.set("player", "B");

  await navigator.clipboard.writeText(url.toString());

  alert("相手用URLをコピーしました");
};

document.getElementById("submitAnswer").onclick =
async () => {

  const answer =
    document.getElementById("answer").value.trim();

  if (!answer) {
    alert("回答を入力してください");
    return;
  }

  const { error } = await db
    .from("answers")
    .insert({
      room_id: roomId,
      player: player,
      answer: answer,
      reveal_at: revealAt
    });

  if (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "送信に失敗しました";
    return;
  }

  document.getElementById("answer").disabled = true;
  document.getElementById("submitAnswer").disabled = true;

  document.getElementById("status").textContent =
    "回答を送信しました。公開時間までお待ちください。";
};

function startTimer() {

  const timer =
    document.getElementById("timer");

  const interval = setInterval(async () => {

    const remaining =
      new Date(revealAt).getTime() - Date.now();

    if (remaining <= 0) {

      clearInterval(interval);

      timer.textContent = "公開！";

      await loadAnswers();

      return;
    }

    const min =
      Math.floor(remaining / 60000);

    const sec =
      Math.floor((remaining % 60000) / 1000);

    timer.textContent =
      `${min}:${String(sec).padStart(2, "0")}`;

  }, 250);
}

async function loadAnswers() {

  const { data, error } = await db
    .from("answers")
    .select("player, answer")
    .eq("room_id", roomId);

  if (error) {
    console.error(error);
    return;
  }

  const a = data.find(x => x.player === "A");
  const b = data.find(x => x.player === "B");

  document.getElementById("answerA").textContent =
    a ? a.answer : "未回答";

  document.getElementById("answerB").textContent =
    b ? b.answer : "未回答";

  document.getElementById("results")
    .classList.remove("hidden");
}

</script>

</body>
</html>
